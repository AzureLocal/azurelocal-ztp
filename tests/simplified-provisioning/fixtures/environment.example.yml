    service_tag: EXAMPLE1
    idrac_ip: 198.51.100.11
    ip_address: 192.0.2.11
    mac_address: "02:00:00:00:00:11"
  - name: node-02
    service_tag: EXAMPLE2
    idrac_ip: 198.51.100.12
    ip_address: 192.0.2.12
