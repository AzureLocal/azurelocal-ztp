  azure_tenant_id: 00000000-0000-0000-0000-000000000000
azure_resources:
  location: eastus
site:
  name: Example Site
hardware:
  vendor: Contoso
  model: AX-760
credentials:
  local_admin_username: deployadmin
  local_admin_password_secret: keyvault://kv-example/deploy-admin-password
network_intents:
