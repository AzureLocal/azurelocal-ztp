# Synthetic schema 5.2 infrastructure.yml for the tests (azurelocal-toolkit config/variables layout; it passes the
# toolkit's validator). Two nodes with six ports each: management on the two onboard LOMs (access ports, static), compute
# and the maintenance environment's way to Azure on two 100G ports, storage on the other two. Placeholder values only:
# the example company Infinite Improbability Corp (iic-* names), documentation addresses (RFC 5737 IPv4, RFC 7042 MACs)
# and all-zero GUIDs. hardware.sbe is for OS configuration and deployment; ZTP doesn't read it.
_metadata:
  schema_version: "5.2.0"

scenario:
  identity: active_directory
  storage_architecture: s2d
  storage_connectivity: switched
  topology: standard
  connectivity: connected
  cloud: public
  outbound_path: direct
  os_install: simplified
  deploy_method: arm

site: { code: "IIC", name: "IIC Dallas", time_zone: "UTC" }
environment: { name: "iic-azl-01", type: lab }

tags:
  purpose: "iic-azl"

azure:
  tenant_id: "00000000-0000-0000-0000-000000000000"
  location: "eastus"
  subscription_id: "00000000-0000-0000-0000-000000000000"
  resource_group: "rg-iic-azl-01"
  hci_resource_provider_object_id: "00000000-0000-0000-0000-000000000001"

key_vaults:
  - { name: "kv-iic-mgmt-01", subscription_id: "00000000-0000-0000-0000-000000000000", resource_group: "rg-iic-mgmt-01" }

cluster:
  name: "iic-azl-01"
  witness: { type: cloud, storage_account: "stiicazl01wit" }
  key_vault: { name: "kv-iic-azl-01" }

nodes:
  - name: "node-01"
    serial_number: "IICSN0001"
    bmc: { ip_address: "198.51.100.11", type: idrac }
    network_adapters:
      - { name: "Embedded NIC 1", mac_address: "00:00:5E:00:53:11", slot: "Embedded", speed_gbps: 1, roles: [management], ip_assignment: static, ip_address: "192.0.2.11", vlan_mode: access, vlan_id: 711 }
      - { name: "Embedded NIC 2", mac_address: "00:00:5E:00:53:21", slot: "Embedded", speed_gbps: 1, roles: [management], ip_assignment: none, vlan_mode: access, vlan_id: 711 }
      - { name: "Slot 3 Port 1", mac_address: "00:00:5E:00:53:31", slot: "Slot 3", model: "Example 100G", speed_gbps: 100, roles: [compute, provisioning], ip_assignment: none, vlan_mode: tagged }
      - { name: "Slot 3 Port 2", mac_address: "00:00:5E:00:53:41", slot: "Slot 3", model: "Example 100G", speed_gbps: 100, roles: [storage], ip_assignment: none, vlan_mode: tagged, vlan_id: 712 }
      - { name: "Slot 6 Port 1", mac_address: "00:00:5E:00:53:51", slot: "Slot 6", model: "Example 100G", speed_gbps: 100, roles: [storage], ip_assignment: none, vlan_mode: tagged, vlan_id: 713 }
      - { name: "Slot 6 Port 2", mac_address: "00:00:5E:00:53:61", slot: "Slot 6", model: "Example 100G", speed_gbps: 100, roles: [compute, provisioning], ip_assignment: none, vlan_mode: tagged }
  - name: "node-02"
    serial_number: "IICSN0002"
    bmc: { ip_address: "198.51.100.12", type: idrac }
    network_adapters:
      - { name: "Embedded NIC 1", mac_address: "00:00:5E:00:53:12", slot: "Embedded", speed_gbps: 1, roles: [management], ip_assignment: static, ip_address: "192.0.2.12", vlan_mode: access, vlan_id: 711 }
      - { name: "Embedded NIC 2", mac_address: "00:00:5E:00:53:22", slot: "Embedded", speed_gbps: 1, roles: [management], ip_assignment: none, vlan_mode: access, vlan_id: 711 }
      - { name: "Slot 3 Port 1", mac_address: "00:00:5E:00:53:32", slot: "Slot 3", model: "Example 100G", speed_gbps: 100, roles: [compute, provisioning], ip_assignment: none, vlan_mode: tagged }
      - { name: "Slot 3 Port 2", mac_address: "00:00:5E:00:53:42", slot: "Slot 3", model: "Example 100G", speed_gbps: 100, roles: [storage], ip_assignment: none, vlan_mode: tagged, vlan_id: 712 }
      - { name: "Slot 6 Port 1", mac_address: "00:00:5E:00:53:52", slot: "Slot 6", model: "Example 100G", speed_gbps: 100, roles: [storage], ip_assignment: none, vlan_mode: tagged, vlan_id: 713 }
      - { name: "Slot 6 Port 2", mac_address: "00:00:5E:00:53:62", slot: "Slot 6", model: "Example 100G", speed_gbps: 100, roles: [compute, provisioning], ip_assignment: none, vlan_mode: tagged }

hardware:
  vendor: "IicHardware"
  model: "AX-760"
  bmc: { username: "keyvault://kv-iic-mgmt-01/bmc-username", password: "keyvault://kv-iic-mgmt-01/bmc-password" }
  sbe: { bundle_path: "D:/iic/sbe" }

networking:
  management:
    subnet: "192.0.2.0/24"
    gateway: "192.0.2.1"
    vlan_id: 0
    dns_servers: ["192.0.2.53", "192.0.2.54"]
    provisioning_network: dhcp
    infrastructure_pool: { start: "192.0.2.20", end: "192.0.2.29" }
  ntp_servers: ["ntp.improbability.cloud"]
  intents:
    - { name: "management", traffic: [management], adapters: ["Embedded NIC 1", "Embedded NIC 2"] }
    - { name: "compute", traffic: [compute], adapters: ["Slot 3 Port 1", "Slot 6 Port 2"] }
    - { name: "storage", traffic: [storage], adapters: ["Slot 3 Port 2", "Slot 6 Port 1"] }
  storage:
    auto_ip: true
    networks:
      - { name: "StorageNetwork1", adapter: "Slot 3 Port 2", vlan_id: 712 }
      - { name: "StorageNetwork2", adapter: "Slot 6 Port 1", vlan_id: 713 }

identity:
  local_admin: { username: "deployadmin", password: "keyvault://kv-iic-mgmt-01/deploy-admin-password" }
  active_directory:
    domain_fqdn: "improbability.cloud"
    ou_path: "OU=iic-azl-01,DC=improbability,DC=cloud"
    lcm_user: { username: "iic-lcm", password: "keyvault://kv-iic-mgmt-01/lcm-password" }

provisioning:
  os_version: "latest"
  simplified:
    site_name: "iic-site-01"
    maintenance_iso: "latest"
    admin: { username: "ztpadmin", password: "keyvault://kv-iic-mgmt-01/ztp-admin-password" }
    media_share: { name: "ztp-iic-media", host: "192.0.2.10" }
