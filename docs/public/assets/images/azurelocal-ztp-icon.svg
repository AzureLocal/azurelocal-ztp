<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Azure Local ZTP">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A86D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003A70;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#001A3A" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="200" height="200" rx="38" ry="38" fill="url(#bgGrad)"/>

  <g opacity="0.08" stroke="white" stroke-width="0.8">
    <line x1="0" y1="50" x2="200" y2="50"/>
    <line x1="0" y1="100" x2="200" y2="100"/>
    <line x1="0" y1="150" x2="200" y2="150"/>
    <line x1="50" y1="0" x2="50" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="150" y1="0" x2="150" y2="200"/>
  </g>

  <!-- Badge polygon top (family mark) -->
  <g transform="translate(100,32)" filter="url(#shadow)">
    <polygon points="0,-14 14,-5 10,12 0,7 -10,12 -14,-5" fill="#E74C3C" stroke="#C0392B" stroke-width="0.8"/>
    <text x="0" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="9" fill="white">L</text>
  </g>

  <!-- Zero-touch glyph: the cloud provisions a server stack, no hands -->
  <g filter="url(#shadow)">
    <circle cx="100" cy="100" r="46" fill="white"/>
    <circle cx="100" cy="100" r="38" fill="url(#bgGrad)"/>

    <!-- Cloud -->
    <path d="M86 84 a7 7 0 0 1 3-13 a10 10 0 0 1 19-2 a8 8 0 0 1 6 15 z" fill="white" opacity="0.95"/>

    <!-- Provisioning path from the cloud to the machines -->
    <line x1="100" y1="86" x2="100" y2="96" stroke="#E74C3C" stroke-width="1.8" stroke-dasharray="2.5,2" stroke-linecap="round"/>
    <polygon points="96,95 104,95 100,100" fill="#E74C3C"/>

    <!-- Server stack -->
    <g fill="none" stroke="white" stroke-width="1.6" opacity="0.92">
      <rect x="80" y="101" width="40" height="8" rx="2"/>
      <rect x="80" y="111" width="40" height="8" rx="2"/>
      <rect x="80" y="121" width="40" height="8" rx="2"/>
    </g>
    <g fill="white" opacity="0.6">
      <rect x="85" y="104" width="16" height="2" rx="1"/>
      <rect x="85" y="114" width="16" height="2" rx="1"/>
      <rect x="85" y="124" width="16" height="2" rx="1"/>
    </g>
    <circle cx="114" cy="105" r="1.8" fill="#2ECC71"/>
    <circle cx="114" cy="115" r="1.8" fill="#2ECC71"/>
    <circle cx="114" cy="125" r="1.8" fill="#2ECC71"/>

    <circle cx="100" cy="100" r="38" fill="none" stroke="white" stroke-width="1.5" opacity="0.2"/>
  </g>

  <!-- Product mark -->
  <text x="100" y="176" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="20" fill="white" letter-spacing="3" opacity="0.95">ZTP</text>
</svg>
