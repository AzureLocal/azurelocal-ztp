<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img" aria-label="Azure Local ZTP: zero-touch provisioning for Azure Local">
  <defs>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#003A70;stop-opacity:1" />
      <stop offset="60%"  style="stop-color:#0078D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A86D8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   style="stop-color:#1A86D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003A70;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#001A3A" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="640" height="160" rx="12" ry="12" fill="url(#bannerGrad)"/>

  <g opacity="0.06" stroke="white" stroke-width="0.8">
    <line x1="0" y1="40"  x2="640" y2="40"/>
    <line x1="0" y1="80"  x2="640" y2="80"/>
    <line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="160" y1="0" x2="160" y2="160"/>
    <line x1="320" y1="0" x2="320" y2="160"/>
    <line x1="480" y1="0" x2="480" y2="160"/>
  </g>

  <!-- Icon square -->
  <rect x="16" y="16" width="128" height="128" rx="20" ry="20" fill="url(#iconGrad)" filter="url(#shadow)"/>

  <g transform="translate(80,36)">
    <polygon points="0,-12 12,-4 8,10 0,6 -8,10 -12,-4" fill="#E74C3C" stroke="#C0392B" stroke-width="0.8"/>
    <text x="0" y="2.5" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="7.5" fill="white">L</text>
  </g>

  <!-- Zero-touch glyph -->
  <g>
    <path d="M67 74 a6 6 0 0 1 2.5-11 a8.5 8.5 0 0 1 16-1.7 a7 7 0 0 1 5 12.7 z" fill="white" opacity="0.95"/>
    <line x1="80" y1="76" x2="80" y2="85" stroke="#E74C3C" stroke-width="1.6" stroke-dasharray="2.5,2" stroke-linecap="round"/>
    <polygon points="76.5,84 83.5,84 80,88.5" fill="#E74C3C"/>
    <g fill="none" stroke="white" stroke-width="1.4" opacity="0.92">
      <rect x="62" y="90"  width="36" height="7" rx="2"/>
      <rect x="62" y="99"  width="36" height="7" rx="2"/>
      <rect x="62" y="108" width="36" height="7" rx="2"/>
    </g>
    <g fill="white" opacity="0.6">
      <rect x="66" y="92.5"  width="14" height="2" rx="1"/>
      <rect x="66" y="101.5" width="14" height="2" rx="1"/>
      <rect x="66" y="110.5" width="14" height="2" rx="1"/>
    </g>
    <circle cx="92" cy="93.5"  r="1.6" fill="#2ECC71"/>
    <circle cx="92" cy="102.5" r="1.6" fill="#2ECC71"/>
    <circle cx="92" cy="111.5" r="1.6" fill="#2ECC71"/>
  </g>

  <circle cx="80" cy="90" r="38" fill="none" stroke="white" stroke-width="1" opacity="0.15"/>

  <text x="164" y="64" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="34" fill="white" letter-spacing="1" opacity="0.98">Azure Local ZTP</text>
  <text x="165" y="94" font-family="'Segoe UI', Arial, sans-serif" font-weight="400" font-size="16" fill="white" letter-spacing="0.5" opacity="0.88">Zero-touch provisioning, from bare metal to ready for Validate</text>
  <text x="165" y="120" font-family="'Segoe UI', Arial, sans-serif" font-weight="400" font-size="12.5" fill="white" letter-spacing="0.4" opacity="0.7">BMC virtual USB · vouchers · Azure claim · OEM drivers · one command</text>
</svg>
